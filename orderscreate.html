<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcureFlow Pro | Enterprise Procurement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== NEO ENTERPRISE DESIGN SYSTEM ===== */
        :root {
            --neo-primary-bg: #f8faff;
            --neo-secondary-bg: #ffffff;
            --neo-card-bg: #ffffff;
            --neo-accent-blue: #0099ff;
            --neo-accent-purple: #9966ff;
            --neo-accent-cyan: #00e5ff;
            --neo-accent-pink: #ff66cc;
            --neo-accent-green: #00e676;
            --neo-accent-orange: #ff9800;
            --neo-accent-red: #ff5252;
            --neo-text-dark: #222233;
            --neo-text-light: #666699;
            --neo-border-light: rgba(0, 153, 255, 0.2);
            --neo-shadow-light: 0 2px 12px rgba(0, 153, 255, 0.08);
            --neo-shadow-medium: 0 4px 20px rgba(0, 153, 255, 0.12);
            --neo-shadow-subtle: 0 1px 4px rgba(0, 153, 255, 0.05);
            --neo-transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro', sans-serif;
        }

        body {
            background: var(--neo-primary-bg);
            color: var(--neo-text-dark);
            height: 100vh;
            overflow: hidden;
            font-size: 12px;
        }

        /* ===== LAYOUT ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            min-width: 320px;
        }

        /* ===== COMPACT TOP BAR ===== */
        .top-bar {
            background: var(--neo-secondary-bg);
            border-bottom: 1px solid var(--neo-border-light);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            box-shadow: var(--neo-shadow-subtle);
            flex-shrink: 0;
            min-height: 44px;
        }

        .system-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
        }

        .title-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--neo-accent-blue), var(--neo-accent-purple));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0, 153, 255, 0.25);
        }

        .title-text {
            flex: 1;
            min-width: 0;
        }

        .title-text h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--neo-text-dark);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-text .subtitle {
            font-size: 10px;
            color: var(--neo-text-light);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-filter-bar {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: center;
            min-width: 0;
            max-width: 600px;
        }

        .search-box {
            flex: 1;
            min-width: 180px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 6px 8px 6px 28px;
            border: 1px solid var(--neo-border-light);
            border-radius: 6px;
            font-size: 12px;
            transition: var(--neo-transition);
            background: var(--neo-secondary-bg);
            height: 30px;
            color: var(--neo-text-dark);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--neo-accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 153, 255, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neo-accent-blue);
            font-size: 12px;
        }

        .filter-buttons {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        /* ===== COMPACT FILTERS BAR ===== */
        .filters-bar {
            padding: 6px 12px;
            background: var(--neo-secondary-bg);
            border-bottom: 1px solid var(--neo-border-light);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-height: 36px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--neo-text-light);
            white-space: nowrap;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
            position: relative;
            background: var(--neo-primary-bg);
        }

        /* ===== DATA TABLE SECTION ===== */
        .data-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--neo-primary-bg);
            min-width: 0;
        }

        /* ===== SELECTION BAR ===== */
        .selection-bar {
            padding: 8px 12px;
            border-bottom: 1px solid var(--neo-border-light);
            background: rgba(0, 153, 255, 0.05);
            display: none;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-height: 40px;
        }

        .selection-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .selected-count {
            font-weight: 600;
            color: var(--neo-accent-blue);
            font-size: 12px;
            white-space: nowrap;
            background: rgba(0, 153, 255, 0.1);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid var(--neo-border-light);
        }

        .selected-value {
            font-size: 12px;
            color: var(--neo-text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 3px 8px;
            background: var(--neo-secondary-bg);
            border-radius: 4px;
            border: 1px solid var(--neo-border-light);
        }

        .selection-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        /* ===== COMPACT ENTERPRISE DATA TABLE ===== */
        .table-container {
            flex: 1;
            overflow: auto;
            position: relative;
            min-height: 0;
            padding: 8px 12px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
            table-layout: fixed;
            background: var(--neo-secondary-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--neo-shadow-light);
            border: 1px solid var(--neo-border-light);
        }

        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th {
            background: rgba(223, 242, 255, 0.7);
            padding: 10px;
            text-align: left;
            font-weight: 600;
            font-size: 10px;
            color: var(--neo-text-light);
            border-bottom: 1px solid var(--neo-border-light);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            height: 36px;
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid var(--neo-border-light);
            font-size: 12px;
            color: var(--neo-text-dark);
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--neo-transition);
            height: 44px;
        }

        .data-table tbody tr {
            transition: var(--neo-transition);
        }

        .data-table tbody tr:hover {
            background: rgba(0, 153, 255, 0.02);
        }

        .data-table tbody tr.selected {
            background: rgba(0, 153, 255, 0.04);
        }

        /* ===== COMPACT TABLE COLUMNS ===== */
        .col-checkbox { width: 36px; min-width: 36px; }
        .col-id { width: 90px; min-width: 90px; }
        .col-name { width: 160px; min-width: 160px; }
        .col-category { width: 90px; min-width: 90px; }
        .col-warehouse { width: 90px; min-width: 90px; }
        .col-stock { width: 70px; min-width: 70px; }
        .col-min { width: 70px; min-width: 70px; }
        .col-usage { width: 90px; min-width: 90px; }
        .col-days { width: 80px; min-width: 80px; }
        .col-status { width: 90px; min-width: 90px; }
        .col-suppliers { width: 140px; min-width: 140px; }
        .col-actions { width: 80px; min-width: 80px; }

        /* ===== COMPACT CHECKBOX ===== */
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .enterprise-checkbox {
            width: 16px;
            height: 16px;
            border: 2px solid var(--neo-border-light);
            border-radius: 4px;
            background: var(--neo-secondary-bg);
            cursor: pointer;
            position: relative;
            transition: var(--neo-transition);
            flex-shrink: 0;
        }

        .enterprise-checkbox:hover {
            border-color: var(--neo-accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 153, 255, 0.1);
        }

        .enterprise-checkbox.checked {
            background: var(--neo-accent-blue);
            border-color: var(--neo-accent-blue);
        }

        .enterprise-checkbox.checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 10px;
            font-weight: 600;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ===== COMPACT STATUS BADGES ===== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            transition: var(--neo-transition);
            letter-spacing: 0.3px;
        }

        .status-critical {
            background: rgba(255, 82, 82, 0.1);
            color: var(--neo-accent-red);
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .status-warning {
            background: rgba(255, 153, 0, 0.1);
            color: var(--neo-accent-orange);
            border: 1px solid rgba(255, 153, 0, 0.2);
        }

        .status-normal {
            background: rgba(0, 230, 118, 0.1);
            color: var(--neo-accent-green);
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        /* ===== COMPACT SUPPLIER TAGS ===== */
        .supplier-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .supplier-tag {
            padding: 2px 6px;
            background: rgba(0, 153, 255, 0.08);
            border-radius: 10px;
            font-size: 9px;
            color: var(--neo-accent-blue);
            font-weight: 500;
            border: 1px solid rgba(0, 153, 255, 0.15);
            white-space: nowrap;
            transition: var(--neo-transition);
        }

        .supplier-tag:hover {
            transform: translateY(-1px);
            background: rgba(0, 153, 255, 0.12);
        }

        .supplier-tag.best {
            background: rgba(0, 230, 118, 0.1);
            color: var(--neo-accent-green);
            border-color: rgba(0, 230, 118, 0.2);
        }

        .supplier-tag.best:hover {
            background: rgba(0, 230, 118, 0.15);
        }

        /* ===== COMPACT BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-weight: 500;
            font-size: 11px;
            cursor: pointer;
            transition: var(--neo-transition);
            white-space: nowrap;
            background: transparent;
            height: 30px;
        }

        .btn-primary {
            background: var(--neo-accent-blue);
            color: white;
            border-color: var(--neo-accent-blue);
        }

        .btn-primary:hover {
            background: #008ae6;
            border-color: #008ae6;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 153, 255, 0.25);
        }

        .btn-secondary {
            background: var(--neo-secondary-bg);
            color: var(--neo-text-dark);
            border-color: var(--neo-border-light);
        }

        .btn-secondary:hover {
            background: #f0f4ff;
            border-color: var(--neo-accent-blue);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--neo-accent-green);
            color: white;
            border-color: var(--neo-accent-green);
        }

        .btn-success:hover {
            background: #00d46b;
            border-color: #00d46b;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 230, 118, 0.25);
        }

        .btn-outline {
            background: transparent;
            color: var(--neo-accent-blue);
            border-color: var(--neo-border-light);
        }

        .btn-outline:hover {
            background: rgba(0, 153, 255, 0.08);
            border-color: var(--neo-accent-blue);
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 10px;
            height: 26px;
        }

        .btn-icon {
            padding: 5px;
            width: 26px;
            height: 26px;
            justify-content: center;
        }

        .btn-compact {
            padding: 2px 8px;
            font-size: 10px;
            height: 24px;
            border-radius: 4px;
        }

        /* ===== ACTION PANEL ===== */
        .action-panel {
            width: 380px;
            background: var(--neo-secondary-bg);
            border-left: 1px solid var(--neo-border-light);
            display: flex;
            flex-direction: column;
            box-shadow: var(--neo-shadow-medium);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
            min-width: 320px;
            max-width: 600px;
            position: relative;
        }

        .action-panel.resizing {
            transition: none;
            user-select: none;
        }

        .panel-resize-handle {
            position: absolute;
            left: -4px;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: col-resize;
            z-index: 10;
            background: transparent;
            transition: var(--neo-transition);
        }

        .panel-resize-handle:hover,
        .panel-resize-handle.resizing {
            background: rgba(0, 153, 255, 0.15);
        }

        .panel-resize-handle::after {
            content: '';
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 30px;
            background: var(--neo-accent-blue);
            border-radius: 1px;
            opacity: 0.5;
        }

        .panel-header {
            padding: 12px;
            border-bottom: 1px solid var(--neo-border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--neo-secondary-bg);
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--neo-text-dark);
            white-space: nowrap;
        }

        .panel-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--neo-border-light);
            cursor: pointer;
            color: var(--neo-text-light);
            transition: var(--neo-transition);
            flex-shrink: 0;
        }

        .panel-close:hover {
            background: rgba(0, 153, 255, 0.08);
            border-color: var(--neo-accent-blue);
            color: var(--neo-accent-blue);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--neo-border-light) transparent;
        }

        .panel-content::-webkit-scrollbar {
            width: 4px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content::-webkit-scrollbar-thumb {
            background-color: var(--neo-border-light);
            border-radius: 8px;
        }

        .panel-content::-webkit-scrollbar-thumb:hover {
            background-color: var(--neo-accent-blue);
        }

        /* COMPACT PANEL FOOTER */
        .panel-footer {
            padding: 8px 12px;
            border-top: 1px solid var(--neo-border-light);
            background: var(--neo-secondary-bg);
            flex-shrink: 0;
        }

        /* ===== COMPACT ORDER ITEM ===== */
        .order-item {
            background: var(--neo-secondary-bg);
            border: 1px solid var(--neo-border-light);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            position: relative;
            transition: var(--neo-transition);
        }

        .order-item:hover {
            border-color: var(--neo-accent-blue);
            box-shadow: var(--neo-shadow-subtle);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 6px;
        }

        .item-title {
            font-weight: 600;
            font-size: 12px;
            color: var(--neo-text-dark);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-subtitle {
            font-size: 11px;
            color: var(--neo-text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== COMPACT QUANTITY CONTROL ===== */
        .quantity-section {
            margin-bottom: 12px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--neo-text-dark);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-input {
            width: 70px;
            padding: 6px 10px;
            border: 1px solid var(--neo-border-light);
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--neo-text-dark);
            background: var(--neo-secondary-bg);
            height: 30px;
            transition: var(--neo-transition);
        }

        .quantity-input:focus {
            outline: none;
            border-color: var(--neo-accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 153, 255, 0.15);
        }

        .quantity-buttons {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .qty-btn {
            width: 22px;
            height: 22px;
            border: 1px solid var(--neo-border-light);
            background: var(--neo-secondary-bg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            color: var(--neo-text-light);
            transition: var(--neo-transition);
        }

        .qty-btn:hover {
            background: var(--neo-accent-blue);
            border-color: var(--neo-accent-blue);
            color: white;
        }

        /* ===== COMPACT SUPPLIER SELECTION ===== */
        .supplier-section {
            margin-bottom: 12px;
        }

        .supplier-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .supplier-option {
            padding: 8px;
            border: 1px solid var(--neo-border-light);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--neo-transition);
            background: var(--neo-secondary-bg);
        }

        .supplier-option:hover {
            border-color: var(--neo-accent-blue);
            background: rgba(0, 153, 255, 0.03);
        }

        .supplier-option.selected {
            border-color: var(--neo-accent-blue);
            background: rgba(0, 153, 255, 0.06);
            box-shadow: 0 0 0 1px rgba(0, 153, 255, 0.1);
        }

        .supplier-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .supplier-name {
            font-weight: 500;
            font-size: 11px;
            color: var(--neo-text-dark);
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .supplier-details {
            font-size: 10px;
            color: var(--neo-text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .supplier-price {
            font-weight: 600;
            font-size: 12px;
            color: var(--neo-accent-blue);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .best-badge {
            display: inline-block;
            padding: 1px 4px;
            background: var(--neo-accent-green);
            color: white;
            border-radius: 8px;
            font-size: 8px;
            font-weight: 600;
            margin-left: 4px;
        }

        /* ===== ULTRA-COMPACT ORDER SUMMARY ===== */
        .order-summary {
            background: var(--neo-secondary-bg);
            border: 1px solid var(--neo-border-light);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            font-size: 11px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--neo-border-light);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            border-top: 1px solid var(--neo-border-light);
            margin-top: 4px;
            padding-top: 6px;
            font-weight: 600;
            color: var(--neo-text-dark);
            font-size: 12px;
        }

        /* ===== TOGGLE PANEL BUTTON ===== */
        .panel-toggle {
            position: absolute;
            left: -32px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 50px;
            background: var(--neo-secondary-bg);
            border: 1px solid var(--neo-border-light);
            border-right: none;
            border-radius: 6px 0 0 6px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: var(--neo-shadow-light);
            transition: var(--neo-transition);
        }

        .panel-toggle:hover {
            background: var(--neo-accent-blue);
            border-color: var(--neo-accent-blue);
            color: white;
        }

                'S002': { id: 'S002', name: 'OfficeWorks Inc.', rating: 4.6, delivery: '1-2 days', priceMultiplier: 1.05, shipping: 15, reliability: 94 },
                'S003': { id: 'S003', name: 'Global Electronics', rating: 4.7, delivery: '3-5 days', priceMultiplier: 0.95, shipping: 30, reliability: 96 },
                'S004': { id: 'S004', name: 'Office Depot', rating: 4.5, delivery: 'Next day', priceMultiplier: 1.1, shipping: 10, reliability: 92 },
                'S005': { id: 'S005', name: 'Furniture Co.', rating: 4.4, delivery: '5-7 days', priceMultiplier: 0.9, shipping: 50, reliability: 90 }

        };

        // ============================================
        // RESIZE FUNCTIONALITY
        // ============================================
        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        function initializeResize() {
            const panel = document.getElementById('actionPanel');
            const resizeHandle = document.getElementById('panelResizeHandle');
            
            if (!panel || !resizeHandle) return;
            
            resizeHandle.addEventListener('mousedown', startResize);
            document.addEventListener('mousemove', doResize);
            document.addEventListener('mouseup', stopResize);
            
            // Touch events for mobile
            resizeHandle.addEventListener('touchstart', startResizeTouch);
            document.addEventListener('touchmove', doResizeTouch);
            document.addEventListener('touchend', stopResize);
        }

        function startResize(e) {
            e.preventDefault();
            isResizing = true;
            startX = e.clientX;
            startWidth = parseInt(getComputedStyle(document.getElementById('actionPanel')).width, 10);
            
            document.getElementById('actionPanel').classList.add('resizing');
            document.getElementById('panelResizeHandle').classList.add('resizing');
            
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        }

        function startResizeTouch(e) {
            e.preventDefault();
            if (e.touches.length !== 1) return;
            
            isResizing = true;
            startX = e.touches[0].clientX;
            startWidth = parseInt(getComputedStyle(document.getElementById('actionPanel')).width, 10);
            
            document.getElementById('actionPanel').classList.add('resizing');
            document.getElementById('panelResizeHandle').classList.add('resizing');
            
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        }

        function doResize(e) {
            if (!isResizing) return;
            e.preventDefault();
            
            const panel = document.getElementById('actionPanel');
            const deltaX = startX - e.clientX;
            let newWidth = startWidth + deltaX;
            
            // Apply constraints
            newWidth = Math.max(320, Math.min(600, newWidth));
            
            panel.style.width = newWidth + 'px';
        }

        function doResizeTouch(e) {
            if (!isResizing || e.touches.length !== 1) return;
            e.preventDefault();
            
            const panel = document.getElementById('actionPanel');
            const deltaX = startX - e.touches[0].clientX;
            let newWidth = startWidth + deltaX;
            
            // Apply constraints
            newWidth = Math.max(320, Math.min(600, newWidth));
            
            panel.style.width = newWidth + 'px';
        }

        function stopResize() {
            if (!isResizing) return;
            
            isResizing = false;
            
            document.getElementById('actionPanel').classList.remove('resizing');
            document.getElementById('panelResizeHandle').classList.remove('resizing');
            
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            
            // Save the width to localStorage for persistence
            const panel = document.getElementById('actionPanel');
            const width = parseInt(panel.style.width, 10);
            if (width && !isNaN(width)) {
                localStorage.setItem('actionPanelWidth', width);
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadSampleData();
            renderTable();
            
            // Initialize resize functionality
            initializeResize();
            
            // Load saved width from localStorage
            const savedWidth = localStorage.getItem('actionPanelWidth');
            if (savedWidth && window.innerWidth > 768) {
                const panel = document.getElementById('actionPanel');
                const width = parseInt(savedWidth, 10);
                if (width && !isNaN(width)) {
                    panel.style.width = Math.max(320, Math.min(600, width)) + 'px';
                }
            }
            
            // Auto-select critical items for efficiency
            setTimeout(() => {
                smartSelect();
            }, 100);
            
            // Adjust panel toggle icon on load
            updatePanelToggleIcon();
            
            // Add resize listener for responsive adjustments
            window.addEventListener('resize', handleResize);
        });

        // ============================================
        // DATA TABLE RENDERING
        // ============================================
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            systemState.allItems.forEach(item => {
                const isSelected = systemState.selectedItems.has(item.id);
                const daysLeft = Math.floor((item.stock / item.weeklyUsage) * 7);
                
                const row = document.createElement('tr');
                if (isSelected) row.classList.add('selected');
                
                row.innerHTML = `
                    <td>
                        <div class="checkbox-container">
                            <div class="enterprise-checkbox ${isSelected ? 'checked' : ''}" 
                                 onclick="toggleItemSelection('${item.id}')"></div>
                        </div>
                    </td>
                    <td>
                        <div class="font-semibold" title="${item.id}">${item.id}</div>
                        <div class="text-xs text-gray" title="${item.controller || 'Unassigned'}">
                            ${item.controller || 'Unassigned'}
                        </div>
                    </td>
                    <td>
                        <div class="font-medium" title="${item.name}">${item.name}</div>
                        <div class="text-xs text-gray" title="${item.category}">${item.category}</div>
                    </td>

                    </td>

                    </td>
                    <td title="${item.minStock}">${item.minStock}</td>
                    <td title="${item.weeklyUsage}/week">${item.weeklyUsage}/week</td>
                    <td>
                        <div class="font-semibold ${daysLeft < 7 ? 'text-danger' : daysLeft < 14 ? 'text-warning' : 'text-success'}" title="${daysLeft} days">
                            ${daysLeft}d
                        </div>
                    </td>
                    <td>
                        <span class="status-badge status-${item.status}" title="${item.status === 'critical' ? 'Critical' : 'Low Stock'}">
                            ${item.status === 'critical' ? 'Critical' : 'Low Stock'}
                        </span>
                    </td>
                    <td>
                        <div class="supplier-tags">
                            ${item.suppliers.map(supplierId => {
                                const supplier = systemState.suppliers[supplierId];
                                const isBest = getBestSupplier(item) === supplierId;
                                const supplierName = supplier.name.split(' ')[0];
                                return `<span class="supplier-tag ${isBest ? 'best' : ''}" title="${supplier.name}">${supplierName}</span>`;
                            }).join('')}
                        </div>
                    </td>
                    <td>
                        <button class="btn btn-outline btn-sm btn-icon" onclick="quickOrderSingle('${item.id}')" title="Quick order">

                `;
                
                tbody.appendChild(row);
            });
            
            updateSelectionUI();
        }

        // ============================================
        // SELECTION MANAGEMENT
        // ============================================
        function toggleItemSelection(itemId) {
            if (systemState.selectedItems.has(itemId)) {
                systemState.selectedItems.delete(itemId);
            } else {
                const item = systemState.allItems.find(i => i.id === itemId);
                if (item) {
                    const bestSupplier = getBestSupplier(item);
                    systemState.selectedItems.set(itemId, {
                        ...item,
                        selectedSupplier: bestSupplier,
                        quantity: calculateOptimalQuantity(item)
                    });
                }
            }
            
            renderTable();
            updateSelectionUI();
        }

        function toggleSelectAll() {
            const allSelected = systemState.selectedItems.size === systemState.allItems.length;
            
            if (allSelected) {
                systemState.selectedItems.clear();
            } else {
                systemState.allItems.forEach(item => {
                    if (!systemState.selectedItems.has(item.id)) {
                        const bestSupplier = getBestSupplier(item);
                        systemState.selectedItems.set(item.id, {
                            ...item,
                            selectedSupplier: bestSupplier,
                            quantity: calculateOptimalQuantity(item)
                        });
                    }
                });
            }
            
            renderTable();
            updateSelectionUI();
        }

        function smartSelect() {
            systemState.selectedItems.clear();
            
            // Enterprise logic: select items based on urgency and business rules
            systemState.allItems.forEach(item => {
                const urgencyScore = calculateUrgencyScore(item);
                
                if (urgencyScore > 50) { // Threshold for automatic selection
                    const bestSupplier = getBestSupplier(item);
                    systemState.selectedItems.set(item.id, {
                        ...item,
                        selectedSupplier: bestSupplier,
                        quantity: calculateOptimalQuantity(item)
                    });
                }
            });
            
            renderTable();
            updateSelectionUI();
            showToast(`${systemState.selectedItems.size} items selected based on urgency`, 'success');
        }

        function calculateUrgencyScore(item) {
            const stockRatio = (item.stock / item.minStock) * 100;
            const daysCoverage = (item.stock / item.weeklyUsage) * 7;
            const usageFactor = Math.min(item.weeklyUsage / 20, 1) * 100;
            
            let score = 100 - stockRatio;
            
            if (daysCoverage < 7) score += 30;
            else if (daysCoverage < 14) score += 15;
            
            score += usageFactor * 0.3;
            
            if (!item.controller) score += 20;
            
            return Math.min(score, 100);
        }

        function clearSelection() {
            systemState.selectedItems.clear();
            renderTable();
            updateSelectionUI();
            showToast('Selection cleared', 'info');
        }

        function updateSelectionUI() {
            const count = systemState.selectedItems.size;
            const selectionBar = document.getElementById('selectionBar');
            const quickOrderBtn = document.getElementById('quickOrderBtn');
            
            if (count > 0) {
                selectionBar.style.display = 'flex';
                quickOrderBtn.style.display = 'flex';
                
                document.getElementById('selectedCount').textContent = `${count} item${count !== 1 ? 's' : ''}`;
                
                let total = 0;
                systemState.selectedItems.forEach(item => {
                    const supplier = systemState.suppliers[item.selectedSupplier];
                    if (supplier) {
                        total += (item.price * supplier.priceMultiplier * item.quantity);
                    }
                });
                
                document.getElementById('selectedTotal').textContent = total.toFixed(2);
            } else {
                selectionBar.style.display = 'none';
                quickOrderBtn.style.display = 'none';
            }
            
            const selectAll = document.getElementById('selectAll');
            const allSelected = count === systemState.allItems.length;
            const someSelected = count > 0 && count < systemState.allItems.length;
            
            selectAll.classList.toggle('checked', allSelected);
            selectAll.style.opacity = someSelected ? '0.6' : '1';
        }

        // ============================================
        // BUSINESS LOGIC
        // ============================================
        function getBestSupplier(item) {
            let bestSupplier = null;
            let bestScore = -1;
            
            item.suppliers.forEach(supplierId => {
                const supplier = systemState.suppliers[supplierId];
                if (supplier) {
                    const priceScore = (1 / supplier.priceMultiplier) * 0.4;
                    const deliveryDays = parseInt(supplier.delivery.split('-')[0]);
                    const deliveryScore = (1 / deliveryDays) * 0.3;
                    const reliabilityScore = (supplier.reliability / 100) * 0.2;
                    const ratingScore = (supplier.rating / 5) * 0.1;
                    
                    const totalScore = priceScore + deliveryScore + reliabilityScore + ratingScore;
                    
                    if (totalScore > bestScore) {
                        bestScore = totalScore;
                        bestSupplier = supplierId;
                    }
                }
            });
            
            return bestSupplier || item.suppliers[0];
        }

        function calculateOptimalQuantity(item) {
            const weeksCoverage = 4;
            const buffer = Math.ceil(item.weeklyUsage * 0.5);
            const required = Math.max(item.minStock - item.stock, 0);
            
            return Math.max(
                required + Math.ceil(item.weeklyUsage * weeksCoverage) + buffer,
                1
            );
        }

        // ============================================
        // ORDER PANEL
        // ============================================
        function openOrderPanel() {
            if (systemState.selectedItems.size === 0) {
                showToast('Please select items first', 'warning');
                return;
            }
            
            renderOrderPanel();
            document.getElementById('actionPanel').classList.add('open');
            updateOrderSummary();
            updatePanelToggleIcon();
        }

        function toggleOrderPanel() {
            const panel = document.getElementById('actionPanel');
            panel.classList.toggle('open');
            updatePanelToggleIcon();
        }

        function closeOrderPanel() {
            document.getElementById('actionPanel').classList.remove('open');
            updatePanelToggleIcon();
        }

        function updatePanelToggleIcon() {
            const panel = document.getElementById('actionPanel');
            const icon = document.getElementById('panelToggleIcon');
            if (panel.classList.contains('open')) {
                icon.className = 'fas fa-chevron-right';
            } else {
                icon.className = 'fas fa-chevron-left';
            }
        }

        function renderOrderPanel() {
            const panelContent = document.getElementById('panelContent');
            
            if (systemState.selectedItems.size === 0) {
                panelContent.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: var(--neo-text-light);">
                        <i class="fas fa-shopping-cart" style="font-size: 32px; margin-bottom: 12px; opacity: 0.5;"></i>
                        <div style="font-size: 13px; font-weight: 500; margin-bottom: 6px;">No items selected</div>
                        <div style="font-size: 11px;">Select items from the table to create a purchase order</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            systemState.selectedItems.forEach((item, itemId) => {
                const supplier = systemState.suppliers[item.selectedSupplier];
                const unitPrice = item.price * supplier.priceMultiplier;
                const itemTotal = unitPrice * item.quantity;
                const bestSupplier = getBestSupplier(item);
                
                html += `
                    <div class="order-item" id="panel-item-${itemId}">
                        <div class="item-header">
                            <div style="flex: 1; min-width: 0;">
                                <div class="item-title" title="${item.name}">${item.name}</div>
                                <div class="item-subtitle" title="${item.id} • ${item.category} • ${item.warehouse}">
                                    ${item.id} • ${item.category} • ${item.warehouse}
                                </div>
                            </div>
                            <button class="btn btn-secondary btn-sm btn-icon" onclick="removeFromOrder('${itemId}')" title="Remove item">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        
                        <div class="quantity-section">
                            <div class="section-label">
                                <i class="fas fa-calculator"></i>
                                Quantity
                            </div>
                            <div class="quantity-control">
                                <input type="number" 
                                       class="quantity-input" 
                                       value="${item.quantity}"
                                       min="1"
                                       max="1000"
                                       onchange="updateOrderQuantity('${itemId}', this.value)"
                                       id="order-qty-${itemId}">
                                <div class="quantity-buttons">
                                    <button class="qty-btn" onclick="adjustOrderQuantity('${itemId}', 1)" title="Increase">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                    <button class="qty-btn" onclick="adjustOrderQuantity('${itemId}', -1)" title="Decrease">
                                        <i class="fas fa-minus"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="text-xs text-gray" style="margin-top: 4px;">
                                Stock: ${item.stock} | Min: ${item.minStock} | Suggested: ${calculateOptimalQuantity(item)}
                            </div>
                        </div>
                        
                        <div class="supplier-section">
                            <div class="section-label">
                                <i class="fas fa-truck"></i>
                                Supplier
                            </div>
                            <div class="supplier-options">
                                ${item.suppliers.map(supplierId => {
                                    const s = systemState.suppliers[supplierId];
                                    const isSelected = supplierId === item.selectedSupplier;
                                    const isBest = supplierId === bestSupplier;
                                    const price = (item.price * s.priceMultiplier).toFixed(2);
                                    
                                    return `
                                        <div class="supplier-option ${isSelected ? 'selected' : ''}" 
                                             onclick="selectOrderSupplier('${itemId}', '${supplierId}')"
                                             title="${s.name} • ${s.delivery} • ${s.rating}★ • ${s.reliability}% reliable • $${price}">
                                            <div class="supplier-info">
                                                <div style="flex: 1; min-width: 0;">
                                                    <div class="supplier-name">
                                                        ${s.name}
                                                        ${isBest ? '<span class="best-badge">BEST</span>' : ''}
                                                    </div>
                                                    <div class="supplier-details">
                                                        ${s.delivery} • ${s.rating}★ • ${s.reliability}% reliable
                                                    </div>
                                                </div>
                                                <div class="supplier-price">$${price}</div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        
                        <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--neo-border-light);">
                            <div style="display: flex; justify-content: space-between; font-size: 11px;">
                                <span class="text-gray">Item Total:</span>
                                <span class="font-semibold">$${itemTotal.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            panelContent.innerHTML = html;
        }

        function selectOrderSupplier(itemId, supplierId) {
            const item = systemState.selectedItems.get(itemId);
            if (item) {
                item.selectedSupplier = supplierId;
                renderOrderPanel();
                updateOrderSummary();
            }
        }

        function updateOrderQuantity(itemId, value) {
            const item = systemState.selectedItems.get(itemId);
            if (item) {
                let newQty = parseInt(value) || 1;
                newQty = Math.max(1, Math.min(1000, newQty));
                item.quantity = newQty;
                updateOrderSummary();
            }
        }

        function adjustOrderQuantity(itemId, delta) {
            const item = systemState.selectedItems.get(itemId);
            if (item) {
                let newQty = item.quantity + delta;
                newQty = Math.max(1, Math.min(1000, newQty));
                item.quantity = newQty;
                
                const input = document.getElementById(`order-qty-${itemId}`);
                if (input) input.value = newQty;
                
                updateOrderSummary();
            }
        }

        function removeFromOrder(itemId) {
            systemState.selectedItems.delete(itemId);
            
            renderOrderPanel();
            renderTable();
            updateOrderSummary();
            
            if (systemState.selectedItems.size === 0) {
                closeOrderPanel();
                showToast('All items removed from order', 'info');
            } else {
                showToast('Item removed from order', 'info');
            }
        }

        function updateOrderSummary() {
            let subtotal = 0;
            let shipping = 0;
            
            systemState.selectedItems.forEach(item => {
                const supplier = systemState.suppliers[item.selectedSupplier];
                if (supplier) {
                    subtotal += (item.price * supplier.priceMultiplier * item.quantity);
                    shipping += supplier.shipping;
                }
            });
            
            const tax = subtotal * 0.1;
            const total = subtotal + shipping + tax;
            
            document.getElementById('summarySubtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('summaryShipping').textContent = `$${shipping.toFixed(2)}`;
            document.getElementById('summaryTax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('summaryTotal').textContent = `$${total.toFixed(2)}`;
        }

        // ============================================
        // ORDER SUBMISSION
        // ============================================
        function submitPurchaseOrder() {
            if (systemState.selectedItems.size === 0) {
                showToast('No items to order', 'warning');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="loading"></div>';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                const poNumbers = ['PO-2024001', 'PO-2024002'];
                showToast(`Purchase Orders created: ${poNumbers.join(', ')}`, 'success');
                
                systemState.selectedItems.clear();
                closeOrderPanel();
                renderTable();
                
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 1500);
        }

        function quickOrderSingle(itemId) {
            const item = systemState.allItems.find(i => i.id === itemId);
            if (item) {
                // Check if already selected
                if (!systemState.selectedItems.has(itemId)) {
                    const bestSupplier = getBestSupplier(item);
                    systemState.selectedItems.set(itemId, {
                        ...item,
                        selectedSupplier: bestSupplier,
                        quantity: calculateOptimalQuantity(item)
                    });
                }
                
                renderTable();
                updateSelectionUI();
                openOrderPanel();
            }
        }

        // ============================================
        // FILTERING FUNCTIONS
        // ============================================
        function filterByWarehouse() {
            const warehouse = document.getElementById('warehouseFilter').value;
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const warehouseCell = row.querySelector('td:nth-child(5)');
                if (warehouse === 'all' || !warehouseCell) {
                    row.style.display = '';
                } else if (warehouseCell.textContent.trim().toLowerCase() === warehouse.toLowerCase()) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
            
            if (warehouse !== 'all') {
                showToast(`Showing items from ${warehouse} warehouse`, 'info');
            }
        }

        function filterByCategory() {
            const category = document.getElementById('categoryFilter').value;
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const categoryCell = row.querySelector('td:nth-child(4)');
                if (category === 'all' || !categoryCell) {
                    row.style.display = '';
                } else if (categoryCell.textContent.trim().toLowerCase().includes(category.toLowerCase())) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
            
            if (category !== 'all') {
                showToast(`Showing ${category} items`, 'info');
            }
        }

        function filterByStatus(status) {
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const statusCell = row.querySelector('.status-badge');
                if (status === 'all' || !statusCell) {
                    row.style.display = '';
                } else if (statusCell.classList.contains(`status-${status}`)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
            
            if (status !== 'all') {
                showToast(`Showing ${status} items only`, 'info');
            }
        }

        function sortTable() {
            const sortBy = document.getElementById('sortFilter').value;
            
            systemState.allItems.sort((a, b) => {
                switch (sortBy) {
                    case 'status':
                        const statusOrder = { critical: 0, warning: 1, normal: 2 };
                        return statusOrder[a.status] - statusOrder[b.status];
                    case 'days':
                        const daysA = Math.floor((a.stock / a.weeklyUsage) * 7);
                        const daysB = Math.floor((b.stock / b.weeklyUsage) * 7);
                        return daysA - daysB;
                    case 'stock':
                        return a.stock - b.stock;
                    case 'name':
                        return a.name.localeCompare(b.name);
                    default:
                        return 0;
                }
            });
            
            renderTable();
            showToast(`Sorted by ${sortBy}`, 'info');
        }

        // ============================================
        // UI UTILITIES
        // ============================================
        function searchTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        function exportData() {
            showToast('Exporting data to Excel...', 'success');
        }

        function handleResize() {
            updatePanelToggleIcon();
            
            // On mobile, reset width to default and hide resize handle
            if (window.innerWidth <= 768) {
                const panel = document.getElementById('actionPanel');
                panel.style.width = '';
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'var(--neo-accent-green)' :
                           type === 'warning' ? 'var(--neo-accent-orange)' : 'var(--neo-accent-blue)';
            
            toast.style.cssText = `
                position: fixed;
                bottom: 12px;
                right: 12px;
                background: var(--neo-secondary-bg);
                padding: 10px 14px;
                border-radius: 8px;
                box-shadow: var(--neo-shadow-medium);
                border-left: 3px solid ${bgColor};
                z-index: 10000;
                display: flex;
                align-items: center;
                gap: 10px;
                animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                max-width: 280px;
                font-size: 12px;
                border: 1px solid var(--neo-border-light);
            `;
            
            const icon = type === 'success' ? 'check-circle' :
                        type === 'warning' ? 'exclamation-triangle' : 'info-circle';
            
            toast.innerHTML = `
                <i class="fas fa-${icon}" style="color: ${bgColor}; font-size: 14px;"></i>
                <div style="flex: 1;">
                    <div style="font-size: 12px; font-weight: 500; color: var(--neo-text-dark);">
                        ${message}
                    </div>
                </div>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                setTimeout(() => {
                    if (toast.parentNode) {
                        document.body.removeChild(toast);
                    }
                }, 300);
            }, 3000);
            
            if (!document.getElementById('toast-animations')) {
                const style = document.createElement('style');
                style.id = 'toast-animations';
                style.textContent = `
                    @keyframes slideIn {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                    @keyframes slideOut {
                        from { transform: translateX(0); opacity: 1; }
                        to { transform: translateX(100%); opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
        }
    </script>
</body>
</html>
